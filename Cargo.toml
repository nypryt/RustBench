[package]
name = "rustbench"
version = "0.1.0"
edition = "2021"
description = "Cross-platform CPU/GPU compute benchmark (OpenGL, Vulkan, Metal)"
license = "MIT"
repository = "https://github.com/nypryt/RustBench"

[dependencies]
# Cross-platform windowing
winit = { version = "0.30", features = ["serde"] }
raw-window-handle = "0.6"

# CPU benchmarking
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OpenGL
glow = { version = "0.14", optional = true }

# Vulkan
ash = { version = "0.37", optional = true }
vk-sys = { version = "0.7", optional = true }

# Metal (macOS only)
metal = { version = "0.28", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }

# Logging
env_logger = "0.11"
log = "0.4"

[features]
default = ["opengl", "vulkan"]
opengl = ["dep:glow"]
vulkan = ["dep:ash", "dep:vk-sys"]
metal_backend = ["dep:metal", "dep:objc2", "dep:objc2-foundation"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true